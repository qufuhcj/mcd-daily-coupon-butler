<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f6"/>
      <stop offset="55%" stop-color="#fffdf7"/>
      <stop offset="100%" stop-color="#fff8e8"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#da291c"/>
      <stop offset="100%" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb400"/>
      <stop offset="100%" stop-color="#ffd66b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#da291c" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="520" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="190" fill="#ffc72c" opacity="0.10"/>
  <circle cx="1450" cy="430" r="150" fill="#da291c" opacity="0.07"/>

  <!-- 左侧文案区 -->
  <g>
    <rect x="80" y="86" width="392" height="46" rx="23" fill="#ffe8e5"/>
    <circle cx="106" cy="109" r="7" fill="#da291c"/>
    <text x="124" y="117" font-size="24" font-weight="700" fill="#c0210f">WorkBuddy Skill · 麦当劳 MCP</text>

    <text x="80" y="206" font-size="74" font-weight="800" fill="#1d1d1f" letter-spacing="-1">麦麦每日领券管家</text>
    <text x="80" y="256" font-size="27" font-weight="600" fill="#da291c">MCD Daily Coupon Butler 🎫</text>

    <text x="80" y="318" font-size="30" font-weight="600" fill="#4a4a4f">每天早上自动替你领券、盯过期、算折扣</text>

    <g font-size="25" font-weight="700" fill="#3a3a3c">
      <rect x="80" y="356" width="240" height="54" rx="14" fill="#ffffff" filter="url(#soft)"/>
      <circle cx="106" cy="383" r="8" fill="#da291c"/>
      <text x="126" y="392">每日自动领券</text>

      <rect x="336" y="356" width="272" height="54" rx="14" fill="#ffffff" filter="url(#soft)"/>
      <circle cx="362" cy="383" r="8" fill="#ff9500"/>
      <text x="382" y="392">今天就过期提醒</text>

      <rect x="624" y="356" width="256" height="54" rx="14" fill="#ffffff" filter="url(#soft)"/>
      <circle cx="650" cy="383" r="8" fill="#34c759"/>
      <text x="670" y="392">折扣率与神券榜</text>
    </g>

    <text x="80" y="452" font-size="23" fill="#8a8a8e">券按天投放 · 积分会悄悄过期 —— 管家每天盯着，一张不浪费</text>
  </g>

  <!-- 右侧券卡组 -->
  <g filter="url(#shadow)">
    <!-- 卡片1：神券 -->
    <g transform="translate(1010 96) rotate(-4)">
      <rect width="470" height="124" rx="20" fill="#ffffff"/>
      <rect x="0" y="0" width="8" height="124" rx="4" fill="url(#red)"/>
      <rect x="24" y="22" width="64" height="64" rx="14" fill="#ffe8e5"/>
      <text x="38" y="64" font-size="30" font-weight="800" fill="#da291c">🍟</text>
      <text x="106" y="52" font-size="27" font-weight="700" fill="#1d1d1f">中薯条买一送一</text>
      <text x="106" y="92" font-size="22" font-weight="700" fill="#6e6e73">用券价 ¥13.5 · 原价 ¥29</text>
      <rect x="336" y="30" width="112" height="42" rx="21" fill="url(#red)"/>
      <text x="392" y="58" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">4.7折</text>
      <rect x="336" y="80" width="112" height="26" rx="13" fill="#fff3d6"/>
      <text x="392" y="99" font-size="18" font-weight="700" fill="#b8860b" text-anchor="middle">🔥 神券</text>
    </g>

    <!-- 卡片2：今天到期 -->
    <g transform="translate(1040 232) rotate(2)">
      <rect width="470" height="124" rx="20" fill="#fff8f7"/>
      <rect x="0" y="0" width="8" height="124" rx="4" fill="#ff9500"/>
      <rect x="24" y="22" width="64" height="64" rx="14" fill="#fff1e3"/>
      <text x="38" y="64" font-size="30" font-weight="800" fill="#ff9500">⏰</text>
      <text x="106" y="52" font-size="27" font-weight="700" fill="#1d1d1f">高达芝士蛋堡早餐两件套</text>
      <text x="106" y="92" font-size="22" font-weight="700" fill="#c0210f">🚨 今天 10:29 到期</text>
      <rect x="336" y="30" width="112" height="42" rx="21" fill="#ff9500"/>
      <text x="392" y="58" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">5.0折</text>
      <rect x="336" y="80" width="112" height="26" rx="13" fill="#fff3d6"/>
      <text x="392" y="99" font-size="18" font-weight="700" fill="#b8860b" text-anchor="middle">🔥 神券</text>
    </g>

    <!-- 卡片3：积分 -->
    <g transform="translate(1070 368) rotate(-2)">
      <rect width="470" height="112" rx="20" fill="#ffffff"/>
      <rect x="0" y="0" width="8" height="112" rx="4" fill="url(#gold)"/>
      <rect x="24" y="24" width="64" height="64" rx="14" fill="#fff6e0"/>
      <text x="38" y="66" font-size="30" font-weight="800" fill="#ffb400">🪙</text>
      <text x="106" y="52" font-size="27" font-weight="700" fill="#1d1d1f">积分 88.9 · 本月将过期 30</text>
      <text x="106" y="90" font-size="21" font-weight="600" fill="#8a8a8e">已悄悄过期 128.6 分，管家天天盯</text>
    </g>
  </g>
</svg>
